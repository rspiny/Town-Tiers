<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Town Tiers Leaderboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .leaderboard {
            padding: 30px;
        }

        .leaderboard-table {
            width: 100%;
            border-collapse: collapse;
        }

        .leaderboard-table thead {
            background: #f8f9fa;
            border-bottom: 3px solid #667eea;
        }

        .leaderboard-table th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
            color: #333;
            text-transform: uppercase;
            font-size: 0.9em;
        }

        .leaderboard-table td {
            padding: 15px;
            border-bottom: 1px solid #e9ecef;
        }

        .leaderboard-table tbody tr {
            transition: background-color 0.2s;
        }

        .leaderboard-table tbody tr:hover {
            background-color: #f8f9fa;
        }

        .rank {
            font-weight: 700;
            font-size: 1.2em;
            color: #667eea;
            width: 50px;
        }

        .rank.gold {
            color: #ffd700;
        }

        .rank.silver {
            color: #c0c0c0;
        }

        .rank.bronze {
            color: #cd7f32;
        }

        .player-name {
            font-weight: 600;
            color: #333;
            font-size: 1.05em;
        }

        .tier {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
        }

        .tier.s {
            background: #ff6b6b;
            color: white;
        }

        .tier.a {
            background: #ff9ff3;
            color: white;
        }

        .tier.b {
            background: #54a0ff;
            color: white;
        }

        .tier.c {
            background: #48dbfb;
            color: white;
        }

        .tier.d {
            background: #feca57;
            color: #333;
        }

        .score {
            font-weight: 700;
            font-size: 1.1em;
            color: #667eea;
        }

        .empty {
            text-align: center;
            padding: 40px;
            color: #999;
            font-size: 1.1em;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .refresh-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            margin-top: 20px;
            transition: background 0.3s;
        }

        .refresh-btn:hover {
            background: #764ba2;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏆 Town Tiers</h1>
            <p>Leaderboard</p>
        </div>

        <div class="leaderboard">
            <div id="content">
                <div class="loading">
                    <div class="spinner"></div>
                    Loading leaderboard...
                </div>
            </div>
            <button class="refresh-btn" onclick="loadLeaderboard()">Refresh</button>
        </div>
    </div>

    <script>
        const API_URL = 'https://town-tiers-vu3e.vercel.app/api/players';

        async function loadLeaderboard() {
            const content = document.getElementById('content');
            content.innerHTML = '<div class="loading"><div class="spinner"></div>Loading leaderboard...</div>';

            try {
                const response = await fetch(API_URL);
                const players = await response.json();

                if (!Array.isArray(players) || players.length === 0) {
                    content.innerHTML = '<div class="empty">No players yet. Start adding players with /addplayer!</div>';
                    return;
                }

                let html = `
                    <table class="leaderboard-table">
                        <thead>
                            <tr>
                                <th>Rank</th>
                                <th>Player</th>
                                <th>Tier</th>
                                <th>Score</th>
                            </tr>
                        </thead>
                        <tbody>
                `;

                players.forEach((player, index) => {
                    const rank = index + 1;
                    let rankClass = '';
                    if (rank === 1) rankClass = 'gold';
                    else if (rank === 2) rankClass = 'silver';
                    else if (rank === 3) rankClass = 'bronze';

                    const tierClass = (player.tier || 'Unranked').toLowerCase().replace(/\s+/g, '').substring(0, 1);

                    html += `
                        <tr>
                            <td class="rank ${rankClass}">#${rank}</td>
                            <td class="player-name">${player.name}</td>
                            <td><span class="tier ${tierClass}">${player.tier || 'Unranked'}</span></td>
                            <td class="score">${player.score}</td>
                        </tr>
                    `;
                });

                html += `
                        </tbody>
                    </table>
                `;

                content.innerHTML = html;
            } catch (error) {
                content.innerHTML = `<div class="empty">Error loading leaderboard: ${error.message}</div>`;
            }
        }

        // Load on page load
        loadLeaderboard();

        // Refresh every 10 seconds
        setInterval(loadLeaderboard, 10000);
    </script>
</body>
</html>
